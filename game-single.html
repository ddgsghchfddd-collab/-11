<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공포의 방 - Horror Room</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            width: 800px;
            height: 600px;
            background-color: #2d2d2d;
            border: 3px solid #666;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #1a1a2e, #16213e);
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            z-index: 10;
            text-shadow: 0 0 10px #00ff00;
        }

        .ui-item {
            margin: 5px 0;
        }

        #controls {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: #00ff00;
            font-size: 12px;
            text-align: center;
            z-index: 10;
            text-shadow: 0 0 10px #00ff00;
        }

        #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
            text-align: center;
        }

        #gameOverScreen.show {
            display: flex;
        }

        #gameOverScreen h1 {
            color: #ff0000;
            font-size: 60px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #ff0000;
        }

        #gameOverScreen p {
            color: #00ff00;
            font-size: 20px;
            margin-bottom: 20px;
        }

        #gameOverScreen button {
            padding: 10px 30px;
            font-size: 18px;
            background-color: #00ff00;
            color: #000;
            border: none;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
        }

        #gameOverScreen button:hover {
            background-color: #00cc00;
        }

        #winScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #001a4d, #003366);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
            text-align: center;
        }

        #winScreen.show {
            display: flex;
        }

        #winScreen h1 {
            color: #ffff00;
            font-size: 60px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #ffff00;
        }

        #winScreen p {
            color: #00ff00;
            font-size: 20px;
            margin-bottom: 20px;
        }

        #winScreen button {
            padding: 10px 30px;
            font-size: 18px;
            background-color: #ffff00;
            color: #000;
            border: none;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
        }

        #winScreen button:hover {
            background-color: #cccc00;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <div id="ui">
            <div class="ui-item">체력: <span id="health">100</span>/100</div>
            <div class="ui-item">열쇠: <span id="keys">0</span>/1</div>
            <div class="ui-item">위치: <span id="position">0, 0</span></div>
            <div class="ui-item">상태: <span id="status">준비 중...</span></div>
        </div>

        <div id="controls">
            WASD: 이동 | ESC: 게임 종료
        </div>

        <div id="gameOverScreen">
            <h1>GAME OVER</h1>
            <p id="gameOverMsg">귀신에게 잡혔습니다!</p>
            <button onclick="location.reload()">다시 시작</button>
        </div>

        <div id="winScreen">
            <h1>ESCAPE!</h1>
            <p>당신은 탈출했습니다!</p>
            <button onclick="location.reload()">다시 시작</button>
        </div>
    </div>

    <script>
        // ===== 오디오 관리 클래스 =====
        class AudioManager {
            constructor() {
                this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                this.masterVolume = 0.5;
            }

            playScaryMusic() {
                const ctx = this.audioContext;
                const now = ctx.currentTime;
                const duration = 4;

                const bass = ctx.createOscillator();
                bass.frequency.value = 55;
                bass.type = 'sine';

                const bassGain = ctx.createGain();
                bassGain.gain.setValueAtTime(0.1, now);
                bassGain.gain.linearRampToValueAtTime(0.2, now + duration);

                bass.connect(bassGain);
                bassGain.connect(ctx.destination);
                bass.start(now);
                bass.stop(now + duration);

                const eerie = ctx.createOscillator();
                eerie.frequency.value = 220;
                eerie.type = 'triangle';

                const eerieGain = ctx.createGain();
                eerieGain.gain.setValueAtTime(0.05, now);
                eerieGain.gain.linearRampToValueAtTime(0.15, now + duration);

                eerie.connect(eerieGain);
                eerieGain.connect(ctx.destination);
                eerie.start(now);
                eerie.stop(now + duration);
            }

            playGhostAppear() {
                const ctx = this.audioContext;
                const now = ctx.currentTime;
                const duration = 0.5;

                const ghost = ctx.createOscillator();
                ghost.frequency.setValueAtTime(100, now);
                ghost.frequency.exponentialRampToValueAtTime(800, now + duration);
                ghost.type = 'square';

                const ghostGain = ctx.createGain();
                ghostGain.gain.setValueAtTime(0.3, now);
                ghostGain.gain.exponentialRampToValueAtTime(0.05, now + duration);

                ghost.connect(ghostGain);
                ghostGain.connect(ctx.destination);
                ghost.start(now);
                ghost.stop(now + duration);
            }

            playDoorOpen() {
                const ctx = this.audioContext;
                const now = ctx.currentTime;
                const duration = 0.8;

                const door = ctx.createOscillator();
                door.frequency.setValueAtTime(200, now);
                door.frequency.linearRampToValueAtTime(150, now + duration);
                door.type = 'sine';

                const doorGain = ctx.createGain();
                doorGain.gain.setValueAtTime(0.2, now);
                doorGain.gain.linearRampToValueAtTime(0.05, now + duration);

                door.connect(doorGain);
                doorGain.connect(ctx.destination);
                door.start(now);
                door.stop(now + duration);

                const noise = ctx.createBufferSource();
                const noiseBuffer = ctx.createBuffer(1, ctx.sampleRate * duration, ctx.sampleRate);
                const noiseData = noiseBuffer.getChannelData(0);
                for (let i = 0; i < noiseBuffer.length; i++) {
                    noiseData[i] = Math.random() * 2 - 1;
                }
                noise.buffer = noiseBuffer;

                const noiseGain = ctx.createGain();
                noiseGain.gain.setValueAtTime(0.1, now);
                noiseGain.gain.linearRampToValueAtTime(0.02, now + duration);

                noise.connect(noiseGain);
                noiseGain.connect(ctx.destination);
                noise.start(now);
            }

            playKeyPickup() {
                const ctx = this.audioContext;
                const now = ctx.currentTime;

                const key1 = ctx.createOscillator();
                key1.frequency.value = 800;
                key1.type = 'sine';

                const key1Gain = ctx.createGain();
                key1Gain.gain.setValueAtTime(0.15, now);
                key1Gain.gain.exponentialRampToValueAtTime(0.02, now + 0.15);

                key1.connect(key1Gain);
                key1Gain.connect(ctx.destination);
                key1.start(now);
                key1.stop(now + 0.15);

                const key2 = ctx.createOscillator();
                key2.frequency.value = 1200;
                key2.type = 'sine';

                const key2Gain = ctx.createGain();
                key2Gain.gain.setValueAtTime(0.15, now + 0.1);
                key2Gain.gain.exponentialRampToValueAtTime(0.02, now + 0.25);

                key2.connect(key2Gain);
                key2Gain.connect(ctx.destination);
                key2.start(now + 0.1);
                key2.stop(now + 0.25);
            }

            playFootstep() {
                const ctx = this.audioContext;
                const now = ctx.currentTime;
                const duration = 0.3;

                const step = ctx.createOscillator();
                step.frequency.setValueAtTime(150, now);
                step.frequency.linearRampToValueAtTime(100, now + duration);
                step.type = 'sine';

                const stepGain = ctx.createGain();
                stepGain.gain.setValueAtTime(0.2, now);
                stepGain.gain.linearRampToValueAtTime(0.05, now + duration);

                step.connect(stepGain);
                stepGain.connect(ctx.destination);
                step.start(now);
                step.stop(now + duration);

                const noise = ctx.createBufferSource();
                const noiseBuffer = ctx.createBuffer(1, ctx.sampleRate * duration, ctx.sampleRate);
                const noiseData = noiseBuffer.getChannelData(0);
                for (let i = 0; i < noiseBuffer.length; i++) {
                    noiseData[i] = Math.random() * 2 - 1;
                }
                noise.buffer = noiseBuffer;

                const noiseGain = ctx.createGain();
                noiseGain.gain.setValueAtTime(0.08, now);
                noiseGain.gain.linearRampToValueAtTime(0.02, now + duration);

                noise.connect(noiseGain);
                noiseGain.connect(ctx.destination);
                noise.start(now);
            }

            playPlayerHit() {
                const ctx = this.audioContext;
                const now = ctx.currentTime;
                const duration = 0.4;

                const hit = ctx.createOscillator();
                hit.frequency.setValueAtTime(400, now);
                hit.frequency.exponentialRampToValueAtTime(200, now + duration);
                hit.type = 'sine';

                const hitGain = ctx.createGain();
                hitGain.gain.setValueAtTime(0.25, now);
                hitGain.gain.exponentialRampToValueAtTime(0.05, now + duration);

                hit.connect(hitGain);
                hitGain.connect(ctx.destination);
                hit.start(now);
                hit.stop(now + duration);
            }

            playBackgroundAmbience() {
                if (this.ambienceInterval) clearInterval(this.ambienceInterval);
                
                this.ambienceInterval = setInterval(() => {
                    const ctx = this.audioContext;
                    const now = ctx.currentTime;
                    
                    if (Math.random() > 0.7) {
                        const ambient = ctx.createOscillator();
                        ambient.frequency.value = Math.random() * 100 + 50;
                        ambient.type = 'sine';

                        const ambientGain = ctx.createGain();
                        ambientGain.gain.setValueAtTime(0.02, now);
                        ambientGain.gain.linearRampToValueAtTime(0.01, now + 1);

                        ambient.connect(ambientGain);
                        ambientGain.connect(ctx.destination);
                        ambient.start(now);
                        ambient.stop(now + 1);
                    }
                }, 2000);
            }

            stopBackgroundAmbience() {
                if (this.ambienceInterval) {
                    clearInterval(this.ambienceInterval);
                }
            }
        }

        const audioManager = new AudioManager();

        // ===== 게임 로직 =====
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const gameState = {
            running: true,
            player: {
                x: 100,
                y: 100,
                width: 30,
                height: 30,
                speed: 3,
                keys: 0,
                health: 100
            },
            ghost: {
                x: 600,
                y: 500,
                width: 40,
                height: 40,
                speed: 2,
                targetPlayer: false,
                direction: 0
            },
            door: {
                x: 700,
                y: 250,
                width: 60,
                height: 100,
                locked: true,
                isOpen: false
            },
            key: {
                x: 400,
                y: 300,
                width: 20,
                height: 20,
                collected: false
            },
            walls: [
                { x: 0, y: 0, width: 800, height: 20 },
                { x: 0, y: 580, width: 800, height: 20 },
                { x: 0, y: 0, width: 20, height: 600 },
                { x: 780, y: 0, width: 20, height: 600 },
                { x: 200, y: 150, width: 300, height: 20 },
            ],
            lastFootstepTime: 0,
            lastScaryMusicTime: 0
        };

        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            if (e.key === 'Escape') {
                gameState.running = false;
                document.getElementById('gameOverScreen').classList.add('show');
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        function getDistance(x1, y1, x2, y2) {
            return Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
        }

        function updatePlayer() {
            const { player, walls } = gameState;
            
            let newX = player.x;
            let newY = player.y;

            if (keys['w']) newY -= player.speed;
            if (keys['s']) newY += player.speed;
            if (keys['a']) newX -= player.speed;
            if (keys['d']) newX += player.speed;

            const potentialRect = { 
                x: newX, 
                y: newY, 
                width: player.width, 
                height: player.height 
            };

            let collision = false;
            for (let wall of walls) {
                if (checkCollision(potentialRect, wall)) {
                    collision = true;
                    break;
                }
            }

            if (!collision) {
                player.x = newX;
                player.y = newY;
            }

            if (!gameState.key.collected && checkCollision(player, gameState.key)) {
                gameState.key.collected = true;
                gameState.player.keys = 1;
                gameState.door.locked = false;
                document.getElementById('keys').textContent = '1';
                audioManager.playKeyPickup();
                document.getElementById('status').textContent = '열쇠를 얻었습니다!';
            }

            if (gameState.player.keys === 1 && !gameState.door.isOpen && checkCollision(player, gameState.door)) {
                gameState.door.isOpen = true;
                audioManager.playDoorOpen();
                gameState.running = false;
                document.getElementById('winScreen').classList.add('show');
            }

            if (checkCollision(player, gameState.ghost)) {
                gameState.player.health = 0;
                gameState.running = false;
                audioManager.playPlayerHit();
                document.getElementById('gameOverScreen').classList.add('show');
            }

            document.getElementById('health').textContent = gameState.player.health;
            document.getElementById('position').textContent = `${Math.floor(player.x)}, ${Math.floor(player.y)}`;
        }

        function updateGhost() {
            const { ghost, player } = gameState;
            const distance = getDistance(ghost.x, ghost.y, player.x, player.y);

            if (distance < 300) {
                ghost.targetPlayer = true;
                audioManager.playScaryMusic();
                
                const angle = Math.atan2(player.y - ghost.y, player.x - ghost.x);
                ghost.x += Math.cos(angle) * ghost.speed;
                ghost.y += Math.sin(angle) * ghost.speed;

                const now = Date.now();
                if (now - gameState.lastFootstepTime > 400) {
                    audioManager.playFootstep();
                    gameState.lastFootstepTime = now;
                }

                if (now - gameState.lastScaryMusicTime > 3000) {
                    audioManager.playScaryMusic();
                    gameState.lastScaryMusicTime = now;
                }

                document.getElementById('status').textContent = '⚠️ 귀신이 다가온다!';
            } else {
                ghost.targetPlayer = false;
                if (Math.random() > 0.98) {
                    ghost.direction = Math.random() * Math.PI * 2;
                }
                ghost.x += Math.cos(ghost.direction) * (ghost.speed * 0.5);
                ghost.y += Math.sin(ghost.direction) * (ghost.speed * 0.5);
                
                if (distance < 400) {
                    document.getElementById('status').textContent = '주변이 으스스합니다...';
                } else {
                    document.getElementById('status').textContent = '안전합니다';
                }
            }

            const { walls } = gameState;
            const ghostRect = { x: ghost.x, y: ghost.y, width: ghost.width, height: ghost.height };
            
            for (let wall of walls) {
                if (checkCollision(ghostRect, wall)) {
                    ghost.direction = Math.random() * Math.PI * 2;
                    ghost.x -= Math.cos(ghost.direction) * ghost.speed;
                    ghost.y -= Math.sin(ghost.direction) * ghost.speed;
                }
            }

            if (checkCollision({ x: ghost.x, y: ghost.y, width: ghost.width, height: ghost.height }, 
                               { x: player.x, y: player.y, width: player.width, height: player.height })) {
                audioManager.playGhostAppear();
                gameState.player.health -= 50;
                if (gameState.player.health <= 0) {
                    gameState.running = false;
                    document.getElementById('gameOverScreen').classList.add('show');
                }
            }
        }

        function draw() {
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#444';
            for (let wall of gameState.walls) {
                ctx.fillRect(wall.x, wall.y, wall.width, wall.height);
            }

            const { player } = gameState;
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.strokeStyle = '#00aa00';
            ctx.lineWidth = 2;
            ctx.strokeRect(player.x, player.y, player.width, player.height);

            const { ghost } = gameState;
            ctx.fillStyle = ghost.targetPlayer ? '#ff3333' : '#8844ff';
            ctx.globalAlpha = ghost.targetPlayer ? 0.9 : 0.6;
            
            ctx.beginPath();
            ctx.arc(ghost.x + ghost.width / 2, ghost.y + ghost.height / 2, ghost.width / 2, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(ghost.x + ghost.width / 2 - 5, ghost.y + 10, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(ghost.x + ghost.width / 2 + 5, ghost.y + 10, 3, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(ghost.x + ghost.width / 2, ghost.y + 20, 3, 0, Math.PI);
            ctx.stroke();
            
            ctx.globalAlpha = 1;

            if (!gameState.key.collected) {
                ctx.fillStyle = '#ffff00';
                ctx.beginPath();
                ctx.arc(gameState.key.x, gameState.key.y, gameState.key.width / 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#ffaa00';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            const { door } = gameState;
            ctx.fillStyle = door.locked ? '#8B4513' : '#90EE90';
            ctx.fillRect(door.x, door.y, door.width, door.height);
            
            ctx.strokeStyle = door.isOpen ? '#00ff00' : '#ff0000';
            ctx.lineWidth = 3;
            ctx.strokeRect(door.x, door.y, door.width, door.height);
            
            ctx.fillStyle = door.isOpen ? '#00ff00' : '#ff0000';
            ctx.font = 'bold 12px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(door.isOpen ? '탈출!' : door.locked ? '잠금' : '열기', door.x + door.width / 2, door.y + door.height / 2);
        }

        function gameLoop() {
            if (gameState.running) {
                updatePlayer();
                updateGhost();
            }
            
            draw();
            requestAnimationFrame(gameLoop);
        }

        document.getElementById('status').textContent = '게임 시작!';
        audioManager.playBackgroundAmbience();
        gameLoop();
    </script>
</body>
</html>
